# The same TLS shape as Caddyfile, for a server that already runs nginx. Everything
# here is the ordinary part of nginx except two lines, and both of them break silently
# if you forget them:
#
#   proxy_http_version 1.1 + Upgrade/Connection   — without these the chat socket is
#       refused at the handshake. Every page still loads, every message still sends over
#       HTTP, and the one thing that stops working is the live arrival. It is the hardest
#       thing on this site to notice from a working screen.
#   client_max_body_size 10m                      — nginx defaults to 1 MB, and a phone
#       photo re-sized to 1600px easily exceeds it. The upload would fail with 413
#       before it reached the API's own 5 MB check, so the limit students hit would be
#       this file's, not the one the site documents.
#
# Set no Content-Security-Policy, no X-Frame-Options and no HSTS here. The API already
# answers every one of them, on the page and on the asset, and a second copy in nginx
# does not override it — it appends, and two CSPs on one document mean the browser
# enforces the intersection of the two, which is a way to break a working site with a
# well-meaning extra line.
#
#   sudo cp deploy/nginx.unmask.conf /etc/nginx/sites-available/unmask
#   sudo ln -s /etc/nginx/sites-available/unmask /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d unmask.example.ac.za      # writes the certificate lines below

upstream unmask_api {
    server 127.0.0.1:4100;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name unmask.example.ac.za;

    # certbot serves the renewal challenge from here, then everything else goes up to
    # HTTPS — which is not a preference: the session cookie is marked Secure, so a
    # student on http:// would be logged in and logged straight back out.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name unmask.example.ac.za;

    # certbot --nginx writes these two paths and the renewal cron keeps them alive.
    ssl_certificate     /etc/letsencrypt/live/unmask.example.ac.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/unmask.example.ac.za/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    # The chat socket, before the general rule, because it needs three things the rest
    # of the site does not.
    location /ws {
        proxy_pass http://unmask_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A socket with no traffic is normal, not dead. nginx's 60-second default would
        # close it in the gap between two messages, and the browser would reconnect —
        # so the symptom is a chat that works and feels strange, not an error.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Do not buffer a stream that is meant to arrive now.
        proxy_buffering off;
    }

    location / {
        proxy_pass http://unmask_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The API answers its own Cache-Control, per file: a year for a hashed asset,
        # no-store for the document and for anything behind a session. nginx does not
        # rewrite a header it was never given a rule about — so add no expires here.
    }
}
